project_id = "rocket-campus-local"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "60MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/**"]
jwt_expiry = 3600
enable_signup = false
minimum_password_length = 6

[edge_runtime]
enabled = true
policy = "per_worker"

# Browser preflight requests do not include the requested POST Authorization
# header. These Functions therefore let OPTIONS reach the shared CORS handler
# and authenticate every POST inside the Function with requireUser or
# requireReadyUser, plus requirePermission for capability-protected actions.
[functions.admin-create-user]
verify_jwt = false

[functions.admin-delete-user]
verify_jwt = false

[functions.admin-list-access-logs]
verify_jwt = false

[functions.admin-list-projects]
verify_jwt = false

